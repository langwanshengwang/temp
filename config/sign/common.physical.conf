# 物理机拓扑模板：把两处 REPLACE_WITH_* 换成两台主机的 IP，再分发到两台机器上。
# 注意 P0 需要在 party=0 的端口上监听（防火墙放行），P1 主动连接 P0。
# DFSS 栈会占用 base、base+3、base+50、base+100 四个端口，两台机器都要放行。
mldsa_mode=44
party=0,REPLACE_WITH_P0_IP,9001,10101
party=1,REPLACE_WITH_P1_IP,9002,10301
dcf_batch_size=1
dcf_pregen_pool_size=8
dcf_pool_exhaustion_mode=refill
open_check_mode=strict
worker_threads=0
timeout_seconds=900
